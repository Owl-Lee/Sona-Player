name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release metadata gate
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the public release repository
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Owl-Lee/Sona-Player') {
            throw "Public releases must run from Owl-Lee/Sona-Player, not $env:GITHUB_REPOSITORY."
          }
      - name: Require tag, Flutter and installer versions to match
        shell: pwsh
        run: ./tool/release_gate.ps1 -Tag $env:RELEASE_TAG

  verify:
    uses: ./.github/workflows/ci.yml

  android:
    name: Signed Android APK
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SONA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SONA_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONA_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sona-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/sona-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          test -s "$RUNNER_TEMP/sona-release.jks"
          chmod 600 "$RUNNER_TEMP/sona-release.jks" android/key.properties
          keytool -list -keystore "$RUNNER_TEMP/sona-release.jks" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" >/dev/null
      - run: flutter pub get
      - name: Build signed APK
        shell: bash
        env:
          ACOUSTID_API_KEY: ${{ secrets.SONA_ACOUSTID_API_KEY }}
        run: |
          test -n "$ACOUSTID_API_KEY"
          flutter build apk --release --dart-define=ACOUSTID_API_KEY="$ACOUSTID_API_KEY"
      - name: Verify APK identity, certificate and stable asset name
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 1F6007D81EBF423D4EBD1AA1658C210D40241C879C97B7C164B233B5C1399BBD
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$AAPT" && test -x "$AAPT"

          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*$/\1/p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          BUILD_NUMBER="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\2/p' pubspec.yaml)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -1)"
          [[ "$PACKAGE_LINE" == *"name='com.sonarvault.sonar_vault'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='$BUILD_NUMBER'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='$VERSION'"* ]]

          mkdir -p dist
          cp "$APK" dist/Sona-Android.apk
          (cd dist && sha256sum Sona-Android.apk > Sona-Android.apk.sha256)
      - name: Validate Android release assets
        shell: pwsh
        run: ./tool/release_gate.ps1 -Tag $env:RELEASE_TAG -ArtifactSet android -ArtifactDirectory dist
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/sona-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows portable and installer
    needs: [preflight, verify]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        env:
          ACOUSTID_API_KEY: ${{ secrets.SONA_ACOUSTID_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACOUSTID_API_KEY)) {
            throw 'SONA_ACOUSTID_API_KEY is not configured.'
          }
          flutter build windows --release --dart-define=ACOUSTID_API_KEY="$env:ACOUSTID_API_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tool/release_gate.ps1 -Tag $env:RELEASE_TAG -WindowsBuildDirectory build/windows/x64/runner/Release
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Sona-Windows-x64.zip -CompressionLevel Optimal
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/Sona.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate checksums
        shell: pwsh
        run: |
          $releaseFiles = @(Get-ChildItem dist -File)
          foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content -Encoding ascii -LiteralPath "$($file.FullName).sha256"
          }
      - name: Validate Windows release assets
        shell: pwsh
        run: ./tool/release_gate.ps1 -Tag $env:RELEASE_TAG -ArtifactSet windows -ArtifactDirectory dist -WindowsBuildDirectory build/windows/x64/runner/Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate complete public asset set
        shell: pwsh
        run: ./tool/release_gate.ps1 -Tag $env:RELEASE_TAG -ArtifactSet all -ArtifactDirectory release-assets
      - name: Resolve versioned release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES_PATH="docs/releases/$VERSION.md"
          test -f "$RELEASE_NOTES_PATH"
          printf 'RELEASE_NOTES_PATH=%s\n' "$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          make_latest: true
          files: release-assets/*
